<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="ZENRICK">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0c1018"/>
    </linearGradient>
    <linearGradient id="neonSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="25%" stop-color="#3f8fff"/>
      <stop offset="50%" stop-color="#7a6aff"/>
      <stop offset="75%" stop-color="#9a55ff"/>
      <stop offset="100%" stop-color="#b24bff"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="25%" stop-color="#3f8fff"/>
      <stop offset="50%" stop-color="#7a6aff"/>
      <stop offset="75%" stop-color="#9a55ff"/>
      <stop offset="100%" stop-color="#b24bff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00aaff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleDepth" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#00aaff" flood-opacity="0.22"/>
    </filter>
    <filter id="subDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#00aaff" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00aaff" stroke-width="0.55" opacity="0.12"/>
    </pattern>
    <pattern id="scan" width="1100" height="7" patternUnits="userSpaceOnUse">
      <rect width="1100" height="1.5" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <clipPath id="frame">
      <rect x="16" y="16" width="1068" height="248" rx="8"/>
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', 'Arial Black', Impact, sans-serif;
      font-size: 62px;
      font-weight: 900;
      letter-spacing: 5px;
      fill: url(#neon);
      filter: url(#titleDepth);
      text-anchor: middle;
    }
    .glitchA { fill: #00aaff; opacity: 0.4; text-anchor: middle; }
    .glitchB { fill: #b24bff; opacity: 0.28; text-anchor: middle; }
    .sub {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 18px;
      fill: url(#neonSoft);
      letter-spacing: 2.5px;
      filter: url(#subDepth);
      text-anchor: middle;
    }
    .hud {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.92;
    }
    .hudMain { fill: url(#neonSoft); }
    .hudAccent { fill: #b24bff; }
    .hudL { text-anchor: start; }
    .hudR { text-anchor: end; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    .scanbeam { animation: scan 4s linear infinite; }
    .glitchShiftA { animation: gA 3.2s steps(2, end) infinite; }
    .glitchShiftB { animation: gB 2.8s steps(2, end) infinite; }
    .borderPulse { animation: borderPulse 2.6s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translateY(-280px); }
      100% { transform: translateY(280px); }
    }
    @keyframes gA {
      0%,92%,100% { transform: translate(0,0); opacity: 0; }
      94% { transform: translate(-5px,1px); opacity: 0.5; }
      96% { transform: translate(4px,-1px); opacity: 0.3; }
    }
    @keyframes gB {
      0%,90%,100% { transform: translate(0,0); opacity: 0; }
      93% { transform: translate(6px,-1px); opacity: 0.45; }
      97% { transform: translate(-3px,2px); opacity: 0.28; }
    }
    @keyframes borderPulse {
      0%,100% { stroke-opacity: 0.45; }
      50% { stroke-opacity: 0.85; }
    }
  </style>

  <rect width="1100" height="280" fill="url(#bg)"/>
  <rect width="1100" height="280" fill="url(#glow)"/>
  <g clip-path="url(#frame)">
    <rect width="1100" height="280" fill="url(#grid)"/>
    <rect width="1100" height="280" fill="url(#scan)"/>

    <g stroke="#00aaff" stroke-width="1.25" fill="none" opacity="0.35">
      <path d="M48 62 H150"/>
      <path d="M950 62 H1052"/>
      <path d="M48 218 H140"/>
      <path d="M960 218 H1052"/>
      <circle cx="150" cy="62" r="3" fill="#00aaff" class="pulse"/>
      <circle cx="950" cy="62" r="3" fill="#00aaff" class="pulse"/>
    </g>

    <rect class="scanbeam" x="16" y="0" width="1068" height="48" fill="url(#beam)"/>

    <g fill="none" stroke="#00aaff" stroke-width="2.5" class="borderPulse" filter="url(#softGlow)">
      <path d="M36 50 V34 H58"/>
      <path d="M1064 50 V34 H1042"/>
      <path d="M36 230 V246 H58"/>
      <path d="M1064 230 V246 H1042"/>
    </g>

    <g>
      <circle cx="72" cy="42" r="4" fill="#b24bff" class="pulse" filter="url(#softGlow)"/>
      <text x="86" y="46" class="hud hudL"><tspan class="hudMain">ZENRICK-DEV // </tspan><tspan class="hudAccent">ONLINE</tspan></text>
      <text x="1028" y="46" class="hud hudR hudMain">NODE: NEXUS</text>
      <text x="72" y="238" class="hud hudL hudMain">SYSTEM_READY</text>
      <text x="1028" y="238" class="hud hudR"><tspan class="hudMain">ORCHESTRA: </tspan><tspan class="hudAccent">ACTIVE</tspan></text>
    </g>

    <text x="550" y="138" class="title glitchA glitchShiftA">ZENRICK</text>
    <text x="550" y="138" class="title glitchShiftB glitchB">ZENRICK</text>
    <text x="550" y="138" class="title">ZENRICK</text>

    <text x="550" y="178" class="sub">> AGENTIC_CORE // SOVEREIGN_INFRA // MULTI_TENANT _</text>
  </g>

  <rect x="16" y="16" width="1068" height="248" rx="8" fill="none" stroke="#00aaff" stroke-width="2" class="borderPulse" filter="url(#softGlow)"/>
</svg>